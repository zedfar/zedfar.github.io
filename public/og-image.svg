<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Subtle background grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>

    <!-- Gradient for Z traces -->
    <linearGradient id="zg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#b400ff"/>
    </linearGradient>

    <!-- Strong glow (for badge Z) -->
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft atmospheric glow (for watermark Z) -->
    <filter id="glow-atm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="1200" height="630" fill="#050508"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Very subtle radial vignette to draw focus to content -->
  <radialGradient id="vig" cx="38%" cy="50%" r="70%">
    <stop offset="0%"   stop-color="rgba(0,229,255,0.03)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.4)"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- Outer frame -->
  <rect x="1" y="1" width="1198" height="628" rx="4"
        fill="none" stroke="rgba(0,229,255,0.16)" stroke-width="1.5"/>

  <!-- Left accent bar -->
  <rect x="48" y="56" width="2" height="518" rx="1"
        fill="rgba(0,229,255,0.22)"/>
  <!-- Dot at top and bottom of accent bar -->
  <circle cx="49" cy="56"  r="3.5" fill="#00e5ff" opacity="0.5"/>
  <circle cx="49" cy="574" r="3.5" fill="#b400ff" opacity="0.5"/>

  <!-- ─── WATERMARK Z (right side, very low opacity) ─── -->
  <!-- Symmetric Z: top-left=(720,90) top-right=(1150,90) bottom-left=(720,540) bottom-right=(1150,540) -->
  <g opacity="0.055" filter="url(#glow-atm)">
    <path d="M720,90 H1150 L720,540 H1150"
          stroke="#00e5ff" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Corner pads for watermark Z, slightly more opaque -->
  <circle cx="720"  cy="90"  r="14" fill="#b400ff" opacity="0.07"/>
  <circle cx="1150" cy="90"  r="14" fill="#00e5ff" opacity="0.07"/>
  <circle cx="720"  cy="540" r="14" fill="#00e5ff" opacity="0.07"/>
  <circle cx="1150" cy="540" r="14" fill="#b400ff" opacity="0.07"/>

  <!-- ─── LOGO BADGE (top-left of content area) ─── -->
  <g transform="translate(70, 58)">
    <!-- Badge background -->
    <rect width="48" height="48" rx="11"
          fill="rgba(0,229,255,0.07)" stroke="rgba(0,229,255,0.22)" stroke-width="1.2"/>
    <!-- Z inside badge — symmetric: (10,13) to (38,13) to (10,35) to (38,35) -->
    <path d="M10,13 H38 L10,35 H38"
          stroke="url(#zg)" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none" filter="url(#glow)"/>
    <circle cx="10" cy="13" r="3" fill="#b400ff"/>
    <circle cx="38" cy="13" r="3" fill="#00e5ff"/>
    <circle cx="10" cy="35" r="3" fill="#00e5ff"/>
    <circle cx="38" cy="35" r="3" fill="#b400ff"/>
  </g>

  <!-- ─── MAIN TEXT CONTENT ─── -->

  <!-- Name — large, bold, monospace -->
  <text x="70" y="228"
        font-family="'Courier New', Courier, monospace"
        font-size="104" font-weight="700"
        fill="#f8fafc" letter-spacing="-3">Zedfar</text>

  <!-- Title — cyan accent -->
  <text x="74" y="279"
        font-family="'Courier New', Courier, monospace"
        font-size="28" font-weight="500" fill="#00e5ff">&lt; Software Engineer /&gt;</text>

  <!-- Divider with cyan accent dot -->
  <line x1="70" y1="310" x2="680" y2="310"
        stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="70" cy="310" r="3" fill="#00e5ff" opacity="0.6"/>

  <!-- Description -->
  <text x="74" y="356"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" fill="#8b949e">Building web, mobile &amp; data visualization solutions</text>
  <text x="74" y="384"
        font-family="'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="20" fill="#8b949e">focused on prototyping and maintainable systems.</text>

  <!-- ─── TECH PILLS ─── -->
  <g transform="translate(70, 428)"
     font-family="'Courier New', Courier, monospace"
     font-size="12.5" fill="#a0aec0">

    <!-- React -->
    <rect x="0"   y="0" width="72"  height="28" rx="6"
          fill="rgba(0,229,255,0.06)" stroke="rgba(0,229,255,0.18)" stroke-width="1"/>
    <text x="36"  y="18.5" text-anchor="middle" fill="#00e5ff">React</text>

    <!-- TypeScript -->
    <rect x="84"  y="0" width="106" height="28" rx="6"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="137" y="18.5" text-anchor="middle">TypeScript</text>

    <!-- Node.js -->
    <rect x="202" y="0" width="80"  height="28" rx="6"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="242" y="18.5" text-anchor="middle">Node.js</text>

    <!-- React Native -->
    <rect x="294" y="0" width="118" height="28" rx="6"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="353" y="18.5" text-anchor="middle">React Native</text>

    <!-- D3.js -->
    <rect x="424" y="0" width="64"  height="28" rx="6"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="456" y="18.5" text-anchor="middle">D3.js</text>

    <!-- Python -->
    <rect x="500" y="0" width="72"  height="28" rx="6"
          fill="rgba(180,0,255,0.06)" stroke="rgba(180,0,255,0.2)" stroke-width="1"/>
    <text x="536" y="18.5" text-anchor="middle" fill="#b400ff">Python</text>

    <!-- Docker -->
    <rect x="584" y="0" width="72"  height="28" rx="6"
          fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="620" y="18.5" text-anchor="middle">Docker</text>
  </g>

  <!-- ─── FOOTER ─── -->
  <!-- Thin footer separator -->
  <line x1="70" y1="546" x2="680" y2="546"
        stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- URL -->
  <text x="375" y="587"
        font-family="'Courier New', Courier, monospace"
        font-size="14" fill="rgba(139,148,158,0.5)"
        text-anchor="middle" letter-spacing="1">zedfar.github.io</text>
</svg>
